<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Background -->
  <rect width="400" height="400" fill="#E0F7FA"/>
  
  <!-- Ground -->
  <rect x="0" y="320" width="400" height="80" fill="#8D6E63"/>
  <rect x="0" y="320" width="400" height="10" fill="#795548"/>
  
  <!-- Bicycle -->
  <!-- Rear wheel -->
  <circle cx="120" cy="280" r="50" fill="none" stroke="#333" stroke-width="6"/>
  <circle cx="120" cy="280" r="5" fill="#555"/>
  <!-- Spokes rear -->
  <line x1="120" y1="230" x2="120" y2="330" stroke="#888" stroke-width="1.5"/>
  <line x1="70" y1="280" x2="170" y2="280" stroke="#888" stroke-width="1.5"/>
  <line x1="85" y1="245" x2="155" y2="315" stroke="#888" stroke-width="1.5"/>
  <line x1="85" y1="315" x2="155" y2="245" stroke="#888" stroke-width="1.5"/>
  
  <!-- Front wheel -->
  <circle cx="280" cy="280" r="50" fill="none" stroke="#333" stroke-width="6"/>
  <circle cx="280" cy="280" r="5" fill="#555"/>
  <!-- Spokes front -->
  <line x1="280" y1="230" x2="280" y2="330" stroke="#888" stroke-width="1.5"/>
  <line x1="230" y1="280" x2="330" y2="280" stroke="#888" stroke-width="1.5"/>
  <line x1="245" y1="245" x2="315" y2="315" stroke="#888" stroke-width="1.5"/>
  <line x1="245" y1="315" x2="315" y2="245" stroke="#888" stroke-width="1.5"/>
  
  <!-- Frame -->
  <!-- Chain stay (rear hub to bottom bracket) -->
  <line x1="120" y1="280" x2="200" y2="270" stroke="#E53935" stroke-width="6" stroke-linecap="round"/>
  <!-- Seat stay (rear hub to seat tube top) -->
  <line x1="120" y1="280" x2="185" y2="195" stroke="#E53935" stroke-width="6" stroke-linecap="round"/>
  <!-- Seat tube (bottom bracket to seat) -->
  <line x1="200" y1="270" x2="185" y2="195" stroke="#E53935" stroke-width="6" stroke-linecap="round"/>
  <!-- Down tube (bottom bracket to head tube bottom) -->
  <line x1="200" y1="270" x2="260" y2="200" stroke="#E53935" stroke-width="6" stroke-linecap="round"/>
  <!-- Top tube (seat to head tube) -->
  <line x1="185" y1="195" x2="260" y2="200" stroke="#E53935" stroke-width="6" stroke-linecap="round"/>
  <!-- Fork -->
  <line x1="260" y1="200" x2="280" y2="280" stroke="#E53935" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Seat post -->
  <line x1="185" y1="195" x2="180" y2="175" stroke="#333" stroke-width="5" stroke-linecap="round"/>
  <!-- Seat -->
  <ellipse cx="180" cy="172" rx="18" ry="6" fill="#333"/>
  
  <!-- Handlebar post -->
  <line x1="260" y1="200" x2="268" y2="170" stroke="#333" stroke-width="5" stroke-linecap="round"/>
  <!-- Handlebar -->
  <line x1="250" y1="170" x2="285" y2="170" stroke="#333" stroke-width="5" stroke-linecap="round"/>
  
  <!-- Crank and pedals -->
  <circle cx="200" cy="270" r="8" fill="#555"/>
  <line x1="200" y1="270" x2="215" y2="290" stroke="#555" stroke-width="4" stroke-linecap="round"/>
  <line x1="215" y1="290" x2="230" y2="285" stroke="#333" stroke-width="4" stroke-linecap="round"/>
  <line x1="200" y1="270" x2="185" y2="250" stroke="#555" stroke-width="4" stroke-linecap="round"/>
  <line x1="185" y1="250" x2="170" y2="255" stroke="#333" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Chain -->
  <path d="M 120 280 L 200 270 L 200 270" fill="none" stroke="#666" stroke-width="2"/>
  <circle cx="120" cy="280" r="12" fill="none" stroke="#666" stroke-width="2"/>
  
  <!-- Pelican -->
  <!-- Body -->
  <ellipse cx="195" cy="155" rx="35" ry="25" fill="#F5F5F5" stroke="#DDD" stroke-width="1"/>
  
  <!-- Wing -->
  <ellipse cx="205" cy="155" rx="20" ry="15" fill="#E0E0E0" transform="rotate(-15 205 155)"/>
  
  <!-- Neck -->
  <path d="M 215 145 Q 230 120 240 100 Q 245 90 240 85" fill="none" stroke="#F5F5F5" stroke-width="14" stroke-linecap="round"/>
  
  <!-- Head -->
  <ellipse cx="242" cy="82" rx="14" ry="12" fill="#F5F5F5"/>
  
  <!-- Beak (long pelican beak) -->
  <path d="M 250 80 L 300 85 L 250 92 Z" fill="#FF8F00"/>
  <!-- Beak pouch -->
  <path d="M 250 92 Q 270 105 300 85 L 250 80 Z" fill="#FFA726" opacity="0.8"/>
  
  <!-- Eye -->
  <circle cx="246" cy="78" r="3" fill="#333"/>
  <circle cx="247" cy="77" r="1" fill="#FFF"/>
  
  <!-- Legs (pedaling) -->
  <!-- Right leg (on pedal) -->
  <line x1="195" y1="175" x2="215" y2="290" stroke="#FF8F00" stroke-width="4" stroke-linecap="round"/>
  <!-- Left leg -->
  <line x1="190" y1="175" x2="185" y2="250" stroke="#FF8F00" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Feet -->
  <ellipse cx="215" cy="290" rx="8" ry="4" fill="#FF8F00"/>
  <ellipse cx="185" cy="250" rx="8" ry="4" fill="#FF8F00"/>
  
  <!-- Tail feathers -->
  <path d="M 165 150 L 150 140 L 155 155 Z" fill="#E0E0E0"/>
  <path d="M 165 155 L 145 150 L 155 162 Z" fill="#E0E0E0"/>
</svg>