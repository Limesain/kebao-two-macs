<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" width="200" height="150">
  <!-- Bicycle wheels -->
  <circle cx="50" cy="120" r="30" fill="#555" stroke="#222" stroke-width="2"/>
  <circle cx="150" cy="120" r="30" fill="#555" stroke="#222" stroke-width="2"/>
  <!-- Bicycle frame -->
  <line x1="50" y1="120" x2="85" y2="80" stroke="#222" stroke-width="4"/>
  <line x1="85" y1="80" x2="115" y2="80" stroke="#222" stroke-width="4"/>
  <line x1="115" y1="80" x2="150" y2="120" stroke="#222" stroke-width="4"/>
  <line x1="115" y1="80" x2="150" y2="120" stroke="#222" stroke-width="4"/>
  <line x1="85" y1="80" x2="150" y2="120" stroke="#222" stroke-width="4"/>
  <line x1="85" y1="80" x2="70" y2="100" stroke="#222" stroke-width="4"/>
  <line x1="70" y2="100" y1="120" x2="50" stroke="#222" stroke-width="4"/>
  <!-- Seat -->
  <rect x="93" y="70" width="14" height="6" fill="#444" rx="2"/>
  <!-- Pedals -->
  <line x1="115" y1="80" x2="115" y2="95" stroke="#222" stroke-width="3"/>
  <line x1="115" y1="95" x2="125" y2="100" stroke="#222" stroke-width="3"/>
  <line x1="115" y1="95" x2="105" y2="100" stroke="#222" stroke-width="3"/>
  <!-- Pelican body -->
  <g transform="translate(100,55)">
    <!-- Body -->
    <ellipse cx="0" cy="15" rx="20" ry="30" fill="#f9c74f"/>
    <!-- Head -->
    <circle cx="-12" cy="0" r="10" fill="#f9c74f"/>
    <!-- Beak -->
    <polygon points="-20,-2 -30,0 -20,2" fill="#ff9f1c"/>
    <!-- Eye -->
    <circle cx="-14" cy="-2" r="2" fill="#000"/>
    <!-- Wing -->
    <path d="M5,20 C15,10 25,30 0,35 Z" fill="#e9b44c"/>
    <!-- Legs (pedaling) -->
    <line x1="0" y1="45" x2="-5" y2="55" stroke="#8d5524" stroke-width="3"/>
    <line x1="0" y1="45" x2="5" y2="55" stroke="#8d5524" stroke-width="3"/>
  </g>
</svg>