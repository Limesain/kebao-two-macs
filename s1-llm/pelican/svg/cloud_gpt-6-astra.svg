<svg xmlns="http://www.w3.org/2000/svg" width="800" height="650" viewBox="0 0 640 520" role="img" aria-labelledby="title desc">
  <title id="title">Pelican riding a bicycle</title>
  <desc id="desc">A cheerful white pelican with a long golden bill pedals a teal bicycle along a sunny seaside path.</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#dff3f3"/>
      <stop offset="1" stop-color="#fff5dc"/>
    </linearGradient>
    <linearGradient id="feathers" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fffef7"/>
      <stop offset="1" stop-color="#d9e4df"/>
    </linearGradient>
    <linearGradient id="pouch" x2="0" y2="1">
      <stop stop-color="#ffd274"/>
      <stop offset="1" stop-color="#ee9c58"/>
    </linearGradient>
    <g id="wheel">
      <circle r="80" fill="#fffdf5" fill-opacity=".6" stroke="#293d45" stroke-width="10"/>
      <circle r="71" fill="none" stroke="#91aaa9" stroke-width="2"/>
      <g stroke="#a3b9b6" stroke-width="1.5">
        <path d="M-70 0H70M0-70V70M-49.5-49.5L49.5 49.5M-49.5 49.5L49.5-49.5"/>
        <path d="M-65-27L65 27M-27-65L27 65M-65 27L65-27M-27 65L27-65"/>
      </g>
      <circle r="9" fill="#e9eee4" stroke="#293d45" stroke-width="3"/>
    </g>
  </defs>

  <rect width="640" height="520" rx="28" fill="url(#sky)"/>
  <circle cx="111" cy="99" r="43" fill="#ffda7d"/>
  <g fill="#fff" opacity=".78">
