    <path d="M155 269H198M143 287H181M162 305H191" stroke="#83b5ae" stroke-width="4"/>
    <path d="M56 438Q58 417 48 407M57 437Q62 414 73 412M57 438L58 411M589 451Q582 431 585 421M589 451Q594 431 604 428" stroke="#8eaa80" stroke-width="4"/>
