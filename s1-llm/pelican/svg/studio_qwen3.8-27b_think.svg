<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Ground -->
  <line x1="20" y1="352" x2="380" y2="352" stroke="#8d8d8d" stroke-width="3"/>

  <!-- Rear wheel -->
  <circle cx="100" cy="300" r="50" fill="none" stroke="#333" stroke-width="6"/>
  <circle cx="100" cy="300" r="6" fill="#333"/>
  <g stroke="#666" stroke-width="2">
    <line x1="100" y1="250" x2="100" y2="350"/>
    <line x1="50" y1="300" x2="150" y2="300"/>
    <line x1="65" y1="265" x2="135" y2="335"/>
    <line x1="135" y1="265" x2="65" y2="335"/>
  </g>

  <!-- Front wheel -->
  <circle cx="300" cy="300" r="50" fill="none" stroke="#333" stroke-width="6"/>
  <circle cx="300" cy="300" r="6" fill="#333"/>
  <g stroke="#666" stroke-width="2">
    <line x1="300" y1="250" x2="300" y2="350"/>
    <line x1="250" y1="300" x2="350" y2="300"/>
    <line x1="265" y1="265" x2="335" y2="335"/>
    <line x1="335" y1="265" x2="265" y2="335"/>
  </g>

  <!-- Frame -->
  <g stroke="#e04a2f" stroke-width="7" fill="none" stroke-linecap="round">
    <line x1="100" y1="300" x2="180" y2="300"/>  <!-- chainstay -->
    <line x1="100" y1="300" x2="140" y2="200"/>  <!-- seat stay -->
    <line x1="180" y1="300" x2="140" y2="200"/>  <!-- seat tube -->
    <line x1="140" y1="200" x2="270" y2="205"/>  <!-- top tube -->
    <line x1="180" y1="300" x2="270" y2="205"/>  <!-- down tube -->
    <line x1="270" y1="205" x2="300" y2="300"/>  <!-- fork -->
  </g>

  <!-- Handlebars -->
  <g stroke="#333" stroke-width="6" fill="none" stroke-linecap="round">
    <line x1="270" y1="205" x2="262" y2="180"/>
    <path d="M 262 180 Q 285 172 292 190"/>
  </g>

  <!-- Saddle -->
  <line x1="140" y1="200" x2="138" y2="188" stroke="#333" stroke-width="6"/>
  <path d="M 120 186 Q 138 176 158 186 Q 140 194 120 186 Z" fill="#333"/>

  <!-- Crank and pedals -->
  <circle cx="180" cy="300" r="10" fill="none" stroke="#333" stroke-width="4"/>
  <line x1="180" y1="300" x2="198" y2="322" stroke="#333" stroke-width="5"/>
  <line x1="180" y1="300" x2="162" y2="278" stroke="#333" stroke-width="5"/>
  <rect x="190" y="318" width="20" height="7" rx="3" fill="#333"/>
  <rect x="152" y="272" width="20" height="7" rx="3" fill="#333"/>

  <!-- Pelican legs -->
  <g stroke="#f5a623" stroke-width="8" fill="none" stroke-linecap="round">
    <path d="M 175 215 Q 195 260 198 320"/>
    <path d="M 160 215 Q 150 250 162 275"/>
  </g>
  <!-- Feet -->
  <path d="M 188 320 L 212 320" stroke="#f5a623" stroke-width="8" stroke-linecap="round"/>
  <path d="M 152 275 L 176 275" stroke="#f5a623" stroke-width="8" stroke-linecap="round"/>

  <!-- Body -->
  <ellipse cx="160" cy="170" rx="55" ry="42" fill="#fdfdfd" stroke="#9aa5ad" stroke-width="4"/>
  <!-- Tail -->
  <path d="M 108 165 Q 88 158 82 145 Q 100 150 112 150 Z" fill="#fdfdfd" stroke="#9aa5ad" stroke-width="3"/>
  <!-- Wing -->
  <path d="M 125 165 Q 160 145 195 168 Q 160 195 125 165 Z" fill="#dfe6ea" stroke="#9aa5ad" stroke-width="3"/>

  <!-- Neck -->
  <path d="M 200 140 Q 225 115 228 92 L 252 100 Q 248 135 228 160 Z" fill="#fdfdfd" stroke="#9aa5ad" stroke-width="4"/>

  <!-- Head -->
  <circle cx="240" cy="88" r="22" fill="#fdfdfd" stroke="#9aa5ad" stroke-width="4"/>
  <!-- Head tuft -->
  <path d="M 232 68 Q 228 58 236 56 Q 238 64 244 66" fill="#fdfdfd" stroke="#9aa5ad" stroke-width="3"/>

  <!-- Beak with pouch -->
  <path d="M 256 82 L 340 96 Q 344 100 340 104 L 258 100 Q 262 118 288 124 Q 316 128 336 106 L 258 100 Z" fill="#f5a623" stroke="#d18a10" stroke-width="3" stroke-linejoin="round"/>
  <!-- Nostril line -->
  <line x1="262" y1="86" x2="300" y2="92" stroke="#d18a10" stroke-width="2"/>

  <!-- Eye -->
  <circle cx="245" cy="82" r="5" fill="#333"/>
  <circle cx="247" cy="80" r="1.8" fill="#fff"/>
</svg>