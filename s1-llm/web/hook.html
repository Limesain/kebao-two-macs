<!doctype html><html lang="zh"><head><meta charset="utf-8"><link rel="stylesheet" href="cards16/_base.css"><style>
.page{padding:40px 90px 110px}
.top{text-align:center}
.q{font-family:"Songti SC",serif;font-size:44px;line-height:1.3;margin:10px 0 0;letter-spacing:.02em}
.q em{font-style:normal;color:var(--gold)}
.panes{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:36px;margin-top:14px}
.pane{position:relative;min-height:0;border:1px solid var(--rule);background:#111;display:flex;align-items:center;justify-content:center;overflow:hidden;transition:border-color .6s,box-shadow .6s}
.pane img{max-width:100%;max-height:100%;object-fit:contain}
.pane .tag{position:absolute;left:0;top:0;padding:10px 18px;background:rgba(13,14,17,.78);border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);font-family:ui-serif,"New York",serif;font-size:34px;color:var(--gold);line-height:1}
.pane .tag small{display:block;font-family:ui-monospace,Menlo,monospace;font-size:12px;letter-spacing:.1em;color:var(--mut);margin-top:6px;opacity:0;transition:opacity .6s}
.pane.win{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 24px 80px rgba(200,169,110,.18)}
.pane.win .tag{color:var(--gold)}.pane .tag.show small{opacity:1}
.bottom{text-align:center;height:58px;margin-top:10px;width:100%}
.ask{font-family:"Songti SC",serif;font-size:26px;color:var(--ink);letter-spacing:.08em;transition:opacity .4s}
.note{font-size:12.5px;letter-spacing:.16em;color:var(--mut);line-height:1.8;opacity:0;transition:opacity .8s;width:100%;text-align:center}
.note b{font-weight:400;color:var(--ink)}
</style></head><body><div class="page">
<div class="top"><div class="kicker" id="k">克宝接管两台 MAC · 第二集 · 出图</div><div class="q" id="q"></div><div class="bottom"><div class="ask" id="ask"></div><div class="note" id="note"></div></div></div>
<div class="panes"><div class="pane" id="pa"><img id="ia"><div class="tag" id="ta">A<small id="sa"></small></div></div><div class="pane" id="pb"><img id="ib"><div class="tag" id="tb">B<small id="sb"></small></div></div></div>
</div><script>
const q=new URLSearchParams(location.search); const el=id=>document.getElementById(id); window.__log={};
el('q').innerHTML=q.get('q')||'本地出图 vs 云端顶级模型，<em>2026 年还差多少</em>？'; el('ask').textContent=q.get('ask')||'同一句提示词、同一时刻出的两张图：哪一张是 Mac 本地画的？';
el('ia').src=q.get('a'); el('ib').src=q.get('b'); el('sa').textContent=q.get('la')||''; el('sb').textContent=q.get('lb')||''; el('note').innerHTML=q.get('note')||'';
const reveal=+(q.get('reveal')||6500), dur=+(q.get('dur')||15000), win=q.get('win')||'a';
setTimeout(()=>{ el('p'+win).classList.add('win'); el('ta').classList.add('show'); el('tb').classList.add('show'); el('ask').style.opacity=0; setTimeout(()=>{el('ask').style.display='none'; el('note').style.opacity=1;},400); }, reveal);
setTimeout(()=>{document.title='DONE';}, dur);
</script></body></html>
