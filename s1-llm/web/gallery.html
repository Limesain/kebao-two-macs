<!doctype html><html lang="zh"><head><meta charset="utf-8"><link rel="stylesheet" href="cards16/_base.css"><script src="models.js"></script><style>
.page{padding:44px 90px 112px}
.hd{display:flex;justify-content:space-between;align-items:flex-end;gap:40px}
.title{font-family:"Songti SC",serif;font-size:34px;margin:8px 0 0;white-space:nowrap}
.pr{font-family:"Songti SC",serif;font-size:14.5px;line-height:1.6;color:var(--mut);max-width:1000px;text-align:right;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.stage{flex:1;min-height:0;margin-top:16px;position:relative}
.spot{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;transition:opacity .55s ease}
.spot.on{opacity:1}.spot .im{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}.spot img{max-width:100%;max-height:100%;object-fit:contain;box-shadow:0 30px 80px rgba(0,0,0,.6);transform:scale(.97);transition:transform 2.8s ease-out}.spot.on img{transform:scale(1)}
.cap{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;color:var(--mut);letter-spacing:.05em;margin-top:12px;white-space:nowrap}.cap b{font-family:ui-serif,"New York",serif;font-weight:400;font-size:19px;color:var(--ink);margin-right:12px;letter-spacing:.02em}.cap i{font-style:normal;color:var(--gold);margin-right:10px;letter-spacing:.2em;font-size:11px}
.grid{position:absolute;inset:0;display:grid;gap:14px;opacity:0;transition:opacity .4s}.grid.on{opacity:1}
.cell{display:flex;flex-direction:column;min-height:0;min-width:0;opacity:0;transform:translateY(14px);transition:opacity .7s cubic-bezier(.2,.7,.2,1),transform .7s cubic-bezier(.2,.7,.2,1)}.grid.on .cell{opacity:1;transform:none}
.cell .im{flex:1;min-height:0;background:#111;border:1px solid var(--rule);display:flex;align-items:center;justify-content:center;overflow:hidden}.cell img{max-width:100%;max-height:100%;object-fit:contain}
.cell .cap{font-size:11px;margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.cell .cap b{font-size:14px;margin-right:8px}
.ml{font-family:ui-serif,"New York",serif;font-size:20px;color:var(--ink);letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ml b{font-weight:400}
.bd{font-style:normal;font-family:"PingFang SC",sans-serif;font-size:10.5px;letter-spacing:.22em;padding:3px 8px;margin-left:12px;vertical-align:3px;border:1px solid}.bd.l{color:var(--gold);border-color:rgba(200,169,110,.6)}.bd.c{color:var(--slate);border-color:rgba(143,163,184,.6)}
.mp{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--mut);letter-spacing:.04em;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spot .cap{margin-top:12px;text-align:center}.spot .ml{font-size:24px}.spot .mp{font-size:13px}
.cell .cap{margin-top:7px}.cell .ml{font-size:16px}.cell .mp{font-size:11px}
</style></head><body><div class="page">
<div class="hd"><div><div class="kicker" id="k"></div><div class="title" id="t"></div></div><div class="pr" id="pr"></div></div>
<div class="stage" id="stage"></div>
<div class="foot"><span id="f">同一提示词 · 同一种子 20261013 · 本地 = Mac Studio M5 Ultra 96 GB · 无头 ComfyUI 0.39.2 / MPS · 云端 = OpenRouter 统一接口 · 2026-10-13</span><span class="sig">克宝 = Claude Fable 5.1 · 思考强度最高 · 实测</span></div></div>
<script>
const q=new URLSearchParams(location.search); const el=id=>document.getElementById(id); window.__log={};
const ORDER=(q.get('order')||'zimage,qwen,krea2,seedream,grok,gptimage').split(','); const mode=q.get('mode')||'spot'; const dwell=+(q.get('dwell')||2.6)*1000; const hold=+(q.get('hold')||5)*1000;
const sleep=ms=>new Promise(r=>setTimeout(r,ms)); const fmt=it=>{const w=it.where==='local'?(it.machine&&it.machine.includes('MacBook')?'本地 · 笔记本':'本地 · 主机'):'云端 · OpenRouter'; const x=[]; if(it.wall_s!=null)x.push(it.wall_s+' s'); if(it.cost_usd!=null)x.push('$'+(+it.cost_usd).toFixed(3)); if(it.width)x.push(it.width+'×'+it.height); if(it.steps)x.push(it.steps+' 步'); return `<i>${w}</i>${x.join(' · ')}`;};
(async()=>{
 const M=await (await fetch('s2/manifest.json?'+Date.now())).json(); const theme=q.get('theme'); const T=M.themes.concat(M.bodies||[]).find(t=>t.id===theme)||{};
 el('k').textContent=q.get('kicker')||('克宝 · 实测 · 出图 · '+(T.group||'')); el('t').textContent=q.get('title')||T.title||theme; el('pr').textContent=q.get('prompt')||T.zh||'';
 let items=q.get('items')?JSON.parse(decodeURIComponent(q.get('items'))):ORDER.map(e=>M.items.find(it=>it.kind!=='duel'&&it.theme===theme&&it.engine===e)).filter(Boolean);
 await Promise.all(items.map(it=>new Promise(r=>{const i=new Image(); i.onload=i.onerror=r; i.src=it.file;})));
 const stage=el('stage');
 if(mode==='spot'){ for(const it of items){ const s=document.createElement('div'); s.className='spot'; s.innerHTML=`<div class="im"><img src="${it.file}"></div><div class="cap">${modelLabel(it)}</div>`; stage.appendChild(s); await sleep(60); s.classList.add('on'); await sleep(dwell); s.classList.remove('on'); if(it!==items[items.length-1]){ await sleep(380); s.remove(); } else { setTimeout(()=>s.remove(), 700); } } }
 const g=document.createElement('div'); g.className='grid'; const land=items[0]&&items[0].width>items[0].height; const n=items.length; g.style.gridTemplateColumns=`repeat(${n<=3?n:Math.ceil(n/2)},minmax(0,1fr))`; g.style.gridAutoRows='minmax(0,1fr)';
 for(const it of items){ const c=document.createElement('div'); c.className='cell'; c.innerHTML=`<div class="im"><img src="${it.file}"></div><div class="cap">${modelLabel(it)}</div>`; g.appendChild(c); }
 stage.appendChild(g); await sleep(60); g.classList.add('on'); [...g.children].forEach((c,i)=>{c.style.transitionDelay=(i*0.16)+'s';}); await sleep(hold+n*160); document.title='DONE';
})();
</script></body></html>
